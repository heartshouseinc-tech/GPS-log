<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Marine Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
:root{--navy:#020d1a;--cyan:#00d4ff;--green:#00ff9d;--amber:#ffaa00;--red:#ff4455;--border:rgba(0,212,255,0.25)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--navy);font-family:'Share Tech Mono',monospace;color:var(--cyan);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
#header{background:#020d1a;border-bottom:1px solid var(--border);padding:6px 12px;display:flex;align-items:center;justify-content:space-between;z-index:1000;flex-shrink:0}
#header h1{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;letter-spacing:2px;color:var(--cyan)}
#sb{display:flex;gap:10px}
.si{font-size:9px;display:flex;flex-direction:column;align-items:center}
.sl{color:rgba(0,212,255,0.4);font-size:8px}
.sv{color:var(--green);font-weight:bold;font-size:11px}
#map{flex:1;position:relative}
.leaflet-container{background:#041428}
/* GPS status top-left */
#gstat{position:absolute;top:10px;left:10px;z-index:999;background:rgba(2,13,26,0.9);border:1px solid var(--border);padding:6px 10px;border-radius:5px;font-size:10px;line-height:1.8;max-width:200px}
#gdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:6px;vertical-align:middle}
#gdot.ok{background:var(--green);animation:gp 2s infinite}
#gdot.err{background:var(--red)}
@keyframes gp{0%,100%{opacity:1}50%{opacity:0.3}}
/* Compass top-right */
#cw{position:absolute;top:10px;right:10px;z-index:999;display:flex;flex-direction:column;align-items:center;gap:3px}
#cr{width:76px;height:76px;border-radius:50%;border:2px solid var(--border);background:radial-gradient(circle,rgba(4,20,40,0.95),rgba(2,13,26,0.98));position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(0,212,255,0.2)}
.cc{position:absolute;font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700}
#ccn{top:4px;left:50%;transform:translateX(-50%);color:var(--red)}
#ccs{bottom:4px;left:50%;transform:translateX(-50%);color:rgba(0,212,255,0.5)}
#ccw{left:4px;top:50%;transform:translateY(-50%);color:rgba(0,212,255,0.5)}
#cce{right:4px;top:50%;transform:translateY(-50%);color:rgba(0,212,255,0.5)}
#ca{position:absolute;width:100%;height:100%;top:0;left:0;transition:transform 0.2s}
#chdg{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
#cdir{font-size:9px;color:rgba(0,212,255,0.5)}
/* Bottom */
#bp{background:#020d1a;border-top:1px solid var(--border);padding:8px 12px 14px;z-index:1000;flex-shrink:0}
#ar{display:flex;gap:6px;margin-bottom:8px}
.btn{flex:1;padding:11px 4px;border:1px solid var(--border);background:rgba(0,212,255,0.06);color:var(--cyan);font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:1px;cursor:pointer;border-radius:4px;transition:all 0.2s}
.btn:active{transform:scale(0.95)}
.breg{border-color:var(--green);color:var(--green);background:rgba(0,255,157,0.08)}
.blog{border-color:var(--amber);color:var(--amber);background:rgba(255,170,0,0.08)}
.bhdg{border-color:var(--cyan)}
.bloc{border-color:var(--cyan)}
.bmod{border-color:#a78bfa;color:#a78bfa;background:rgba(167,139,250,0.08)}
.btn.on{filter:brightness(1.5);box-shadow:0 0 12px currentColor}
#wpp{max-height:90px;overflow-y:auto}
.wpi{display:flex;align-items:center;padding:5px 8px;border:1px solid rgba(0,212,255,0.1);border-radius:3px;margin-bottom:3px;background:rgba(0,212,255,0.04);gap:8px}
.wpd{width:9px;height:9px;background:var(--green);border-radius:50%;box-shadow:0 0 6px var(--green);flex-shrink:0}
.wpd.m{background:#a78bfa;box-shadow:0 0 6px #a78bfa}
.wpn{flex:1;font-size:11px;border:none;background:transparent;font-family:'Share Tech Mono',monospace;color:var(--green);outline:none}
.wpn.m{color:#a78bfa}
.wpn:focus{border-bottom:1px solid currentColor}
.wpc{font-size:8px;color:rgba(0,212,255,0.4);flex-shrink:0}
.wpx{background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:0 2px;opacity:0.6}
.stl{font-size:8px;letter-spacing:2px;color:rgba(0,212,255,0.35);margin-bottom:5px}
/* Log */
#lp{position:absolute;bottom:10px;left:10px;right:10px;background:rgba(2,13,26,0.93);border:1px solid var(--border);border-radius:5px;padding:8px;z-index:998;display:none;max-height:120px;overflow-y:auto}
#lp.on{display:block}
.le{font-size:9px;color:rgba(0,212,255,0.6);padding:2px 0;border-bottom:1px solid rgba(0,212,255,0.05);display:flex;gap:6px}
.lt{color:var(--amber);flex-shrink:0}
#rd{width:7px;height:7px;border-radius:50%;background:var(--red);display:none;vertical-align:middle}
#rd.on{display:inline-block;animation:bl 1s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0.1}}
/* Modal */
#mo{position:fixed;inset:0;background:rgba(2,13,26,0.9);z-index:2000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#mo.on{display:flex}
#md{background:#041428;border:1px solid var(--border);border-radius:8px;padding:20px;width:82%;max-width:320px}
#md h2{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--green);letter-spacing:2px;margin-bottom:12px}
#md input{width:100%;background:rgba(0,212,255,0.06);border:1px solid var(--border);border-radius:4px;padding:9px 11px;color:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:13px;outline:none;margin-bottom:14px}
#md input:focus{border-color:var(--green)}
#mco{font-size:10px;color:rgba(0,212,255,0.6);margin-bottom:14px;line-height:1.8}
#mb{display:flex;gap:8px}
#mb .btn{padding:9px}
.bcon{border-color:var(--green);color:var(--green);background:rgba(0,255,157,0.1)}
.bcan{border-color:rgba(255,68,85,0.5);color:var(--red);background:rgba(255,68,85,0.05)}
.wpin{width:12px;height:12px;background:var(--green);border-radius:50%;border:2px solid rgba(0,255,157,0.3);box-shadow:0 0 8px var(--green)}
.wpin.m{background:#a78bfa;border-color:rgba(167,139,250,0.3);box-shadow:0 0 8px #a78bfa}
</style>
</head>
<body>
<div id="header">
  <h1 id="ttl">⚓ MARINE TRACKER</h1>
  <div id="sb">
    <div class="si"><span class="sl">LAT</span><span class="sv" id="dlat">---</span></div>
    <div class="si"><span class="sl">LNG</span><span class="sv" id="dlng">---</span></div>
    <div class="si"><span class="sl">HDG</span><span class="sv" id="dhdg">---°</span></div>
    <div class="si"><span class="sl">SPD</span><span class="sv" id="dspd">--</span></div>
    <div class="si"><span class="sl">REC</span><span class="sv"><span id="rd"></span></span></div>
  </div>
</div>

<div id="map">
  <div id="gstat"><span id="gdot"></span><span id="gmsg">起動中...</span><br><span id="gacc"></span></div>
  <div id="cw">
    <div id="cr">
      <span class="cc" id="ccn">N</span><span class="cc" id="ccs">S</span>
      <span class="cc" id="ccw">W</span><span class="cc" id="cce">E</span>
      <svg id="ca" viewBox="0 0 76 76">
        <polygon points="38,6 43,38 38,34 33,38" fill="#ff4455" opacity="0.95"/>
        <polygon points="38,70 43,38 38,42 33,38" fill="rgba(0,212,255,0.55)"/>
        <circle cx="38" cy="38" r="3.5" fill="#00d4ff"/>
      </svg>
    </div>
    <div id="chdg">---°</div>
    <div id="cdir">---</div>
  </div>
  <div id="lp"><div class="stl">◈ LOG</div><div id="le"></div></div>
</div>

<div id="bp">
  <div id="ar">
    <button class="btn breg" onclick="openModal()">📍 登録</button>
    <button class="btn bhdg" id="bhdg" onclick="toggleHdg()">🧭 HDG</button>
    <button class="btn blog" id="blog" onclick="toggleLog()">● LOG</button>
    <button class="btn bloc" onclick="locate()">🎯 現在地</button>
    <button class="btn bmod" id="bmod" onclick="toggleMode()">⛵ 海</button>
  </div>
  <div class="stl">◈ ポイント (<span id="wpc">0</span>)</div>
  <div id="wpp"><div style="font-size:10px;color:rgba(0,212,255,0.25);text-align:center;padding:6px">登録ポイントなし</div></div>
</div>

<div id="mo"><div id="md">
  <h2 id="mtitle">📍 ポイント登録</h2>
  <div id="mco">---</div>
  <input type="text" id="mi" placeholder="名前を入力..." maxlength="30">
  <div id="mb">
    <button class="btn bcan" onclick="closeModal()">キャンセル</button>
    <button class="btn bcon" onclick="confirmReg()">登録</button>
  </div>
</div></div>

<script>
// ===== State =====
let map, marker, trackLine;
let trackCoords=[], waypoints=[];
let pos=null, hdg=0;
let hdgUp=false, logging=false, mode='sea';
let wid=null;
let layers={};

// ===== Helpers =====
const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const toDir=h=>dirs[Math.round(h/22.5)%16];

// ===== Map =====
function initMap(){
  map=L.map('map',{center:[35.45,139.65],zoom:13,zoomControl:true,attributionControl:false});
  layers.osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,opacity:0.75});
  layers.sea=L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',{maxZoom:18});
  layers.topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17});
  layers.osm.addTo(map);
  layers.sea.addTo(map);
  trackLine=L.polyline([],{color:'#00d4ff',weight:2,opacity:0.7,dashArray:'5,5'}).addTo(map);
  L.control.attribution({position:'bottomleft',prefix:''})
    .addAttribution('© OpenStreetMap © OpenSeaMap © OpenTopoMap').addTo(map);
}

// ===== GPS =====
function initGPS(){
  if(!navigator.geolocation){
    setStatus('err','GPS非対応',''); return;
  }
  setStatus('wait','GPS取得中...','');
  doWatch();
}

function doWatch(){
  if(wid!==null) navigator.geolocation.clearWatch(wid);
  wid=navigator.geolocation.watchPosition(
    onPos,
    onErr,
    {enableHighAccuracy:true, maximumAge:0, timeout:60000}
  );
}

function onPos(p){
  const {latitude:lat,longitude:lng,speed,accuracy,heading:gh}=p.coords;
  setStatus('ok','現在地取得中',Math.round(accuracy)+'m');
  if(gh!==null&&!isNaN(gh)) updateHdg(gh);
  const spd=speed?(mode==='sea'?speed*1.94384:speed*3.6):0;
  updatePos(lat,lng,spd);
}

function onErr(e){
  const msgs={1:'位置情報を許可してください',2:'GPS信号なし',3:'GPS再試行中...'};
  setStatus(e.code===1?'err':'wait', msgs[e.code]||'GPSエラー','');
  if(e.code===3) setTimeout(doWatch,3000); // timeout→retry
}

function setStatus(s,msg,acc){
  const d=document.getElementById('gdot');
  d.className=s==='ok'?'ok':s==='err'?'err':'';
  document.getElementById('gmsg').textContent=msg;
  document.getElementById('gacc').textContent=acc?'精度: '+acc:'';
}

function updatePos(lat,lng,spd){
  pos={lat,lng};
  document.getElementById('dlat').textContent=lat.toFixed(5);
  document.getElementById('dlng').textContent=lng.toFixed(5);
  document.getElementById('dspd').textContent=spd.toFixed(1)+(mode==='sea'?'kt':'km/h');
  updateMarker(lat,lng,hdg);
  if(logging){trackCoords.push([lat,lng]);trackLine.setLatLngs(trackCoords);addLog(lat,lng,spd);}
  if(hdgUp) map.setView([lat,lng]);
}

// ===== Marker =====
function markerHTML(h,sea){
  const c=sea?'#00d4ff':'#a78bfa';
  return `<svg width="44" height="44" viewBox="0 0 44 44" style="transform:rotate(${h}deg);filter:drop-shadow(0 0 7px ${c});display:block">
    <polygon points="22,2 29,42 22,34 15,42" fill="${c}" opacity="0.95"/>
    <circle cx="22" cy="22" r="4" fill="white" opacity="0.9"/>
  </svg>`;
}

function updateMarker(lat,lng,h){
  const icon=L.divIcon({className:'',html:markerHTML(h,mode==='sea'),iconSize:[44,44],iconAnchor:[22,22]});
  if(marker){marker.setLatLng([lat,lng]);marker.setIcon(icon);}
  else{marker=L.marker([lat,lng],{icon,zIndexOffset:1000}).addTo(map);map.setView([lat,lng],15);}
}

// ===== Compass =====
function initCompass(){
  const h=e=>{
    let v=null;
    if(e.webkitCompassHeading!=null) v=e.webkitCompassHeading;
    else if(e.alpha!=null) v=(360-e.alpha)%360;
    if(v!=null&&!isNaN(v)) updateHdg(v);
  };
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(s=>{
      if(s==='granted'){window.addEventListener('deviceorientationabsolute',h,true);window.addEventListener('deviceorientation',h,true);}
    }).catch(()=>{});
  } else {
    window.addEventListener('deviceorientationabsolute',h,true);
    window.addEventListener('deviceorientation',h,true);
  }
}

function updateHdg(h){
  hdg=h;
  document.getElementById('dhdg').textContent=Math.round(h)+'°';
  document.getElementById('chdg').textContent=Math.round(h)+'°';
  document.getElementById('cdir').textContent=toDir(h);
  document.getElementById('ca').style.transform=`rotate(${-h}deg)`;
  if(pos) updateMarker(pos.lat,pos.lng,h);
}

// ===== Controls =====
function toggleHdg(){
  hdgUp=!hdgUp;
  const b=document.getElementById('bhdg');
  b.classList.toggle('on',hdgUp);
  b.textContent=hdgUp?'🧭 HDG ✓':'🧭 HDG';
  if(hdgUp){initCompass();if(pos)map.setView([pos.lat,pos.lng]);}
}

function toggleLog(){
  logging=!logging;
  const b=document.getElementById('blog'),d=document.getElementById('rd');
  if(logging){
    trackCoords=[];trackLine.setLatLngs([]);
    document.getElementById('le').innerHTML='';
    document.getElementById('lp').classList.add('on');
    b.classList.add('on');b.textContent='■ STOP';d.classList.add('on');
  } else {
    b.classList.remove('on');b.textContent='● LOG';d.classList.remove('on');
  }
}

function addLog(lat,lng,spd){
  const t=new Date().toTimeString().slice(0,8);
  const el=document.createElement('div');
  el.className='le';
  el.innerHTML=`<span class="lt">${t}</span>${lat.toFixed(4)},${lng.toFixed(4)} ${spd.toFixed(1)}`;
  const c=document.getElementById('le');c.appendChild(el);c.scrollTop=c.scrollHeight;
}

function locate(){
  if(!pos){alert('GPS取得中です。しばらくお待ちください');return;}
  map.flyTo([pos.lat,pos.lng],16,{duration:1});
}

function toggleMode(){
  mode=mode==='sea'?'mountain':'sea';
  const b=document.getElementById('bmod');
  if(mode==='mountain'){
    map.removeLayer(layers.osm);map.removeLayer(layers.sea);layers.topo.addTo(map);
    b.textContent='🏔 山';document.getElementById('ttl').textContent='🏔 MOUNTAIN TRACKER';
  } else {
    map.removeLayer(layers.topo);layers.osm.addTo(map);layers.sea.addTo(map);
    b.textContent='⛵ 海';document.getElementById('ttl').textContent='⚓ MARINE TRACKER';
  }
}

// ===== Waypoints =====
let ppos=null;
function openModal(){
  if(!pos){alert('GPS取得中です');return;}
  ppos={...pos};
  document.getElementById('mtitle').textContent=mode==='mountain'?'🏔 ポイント登録':'📍 ポイント登録';
  document.getElementById('mco').innerHTML=`緯度: <b>${ppos.lat.toFixed(6)}</b><br>経度: <b>${ppos.lng.toFixed(6)}</b>`;
  document.getElementById('mi').value='';
  document.getElementById('mo').classList.add('on');
  setTimeout(()=>document.getElementById('mi').focus(),100);
}
function closeModal(){document.getElementById('mo').classList.remove('on');ppos=null;}
function confirmReg(){
  const n=document.getElementById('mi').value.trim();
  if(!n){document.getElementById('mi').focus();return;}
  const wp={id:Date.now(),name:n,lat:ppos.lat,lng:ppos.lng,mode};
  waypoints.push(wp);
  const isMtn=mode==='mountain';
  const icon=L.divIcon({className:'',html:`<div class="wpin${isMtn?' m':''}"></div>`,iconSize:[12,12],iconAnchor:[6,6]});
  wp.marker=L.marker([wp.lat,wp.lng],{icon})
    .bindPopup(`<b style="color:${isMtn?'#a78bfa':'#00ff9d'};font-family:monospace">${n}</b><br><small>${wp.lat.toFixed(5)},${wp.lng.toFixed(5)}</small>`)
    .addTo(map);
  renderWP();closeModal();
}
function renderWP(){
  const p=document.getElementById('wpp');
  document.getElementById('wpc').textContent=waypoints.length;
  if(!waypoints.length){p.innerHTML='<div style="font-size:10px;color:rgba(0,212,255,0.25);text-align:center;padding:6px">登録ポイントなし</div>';return;}
  p.innerHTML=waypoints.map((w,i)=>`
    <div class="wpi">
      <div class="wpd${w.mode==='mountain'?' m':''}"></div>
      <input class="wpn${w.mode==='mountain'?' m':''}" value="${w.name}" onchange="renWP(${i},this.value)" onclick="flyWP(${i})">
      <span class="wpc">${w.lat.toFixed(3)},${w.lng.toFixed(3)}</span>
      <button class="wpx" onclick="delWP(${i})">✕</button>
    </div>`).join('');
}
function renWP(i,n){
  if(!n.trim())return;waypoints[i].name=n.trim();
  if(waypoints[i].marker)waypoints[i].marker.getPopup().setContent(`<b style="color:${waypoints[i].mode==='mountain'?'#a78bfa':'#00ff9d'};font-family:monospace">${n}</b><br><small>${waypoints[i].lat.toFixed(5)},${waypoints[i].lng.toFixed(5)}</small>`);
}
function flyWP(i){map.flyTo([waypoints[i].lat,waypoints[i].lng],16,{duration:1});if(waypoints[i].marker)waypoints[i].marker.openPopup();}
function delWP(i){if(waypoints[i].marker)map.removeLayer(waypoints[i].marker);waypoints.splice(i,1);renderWP();}
document.getElementById('mi').addEventListener('keydown',e=>{if(e.key==='Enter')confirmReg();if(e.key==='Escape')closeModal();});

// ===== Boot =====
initMap();
initGPS();
initCompass();
</script>
</body>
</html>
