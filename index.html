<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>フィールドトラッカー</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
:root{--navy:#020d1a;--deep:#041428;--teal:#0e6b8a;--cyan:#00d4ff;--green:#00ff9d;--amber:#ffaa00;--red:#ff4455;--glass:rgba(0,212,255,0.08);--border:rgba(0,212,255,0.25)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--navy);font-family:'Share Tech Mono',monospace;color:var(--cyan);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
#header{background:linear-gradient(180deg,#020d1a,rgba(2,13,26,0.97));border-bottom:1px solid var(--border);padding:6px 12px;display:flex;align-items:center;justify-content:space-between;z-index:1000;flex-shrink:0}
#header h1{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;letter-spacing:2px;color:var(--cyan);text-shadow:0 0 15px var(--cyan)}
#status-bar{display:flex;gap:8px;align-items:center}
.si{font-size:9px;display:flex;flex-direction:column;align-items:center;gap:1px}
.sl{color:rgba(0,212,255,0.45);font-size:8px}
.sv{color:var(--green);font-weight:bold;font-size:10px}
#map{flex:1;position:relative}
.leaflet-container{background:#041428}
#bottom-panel{background:linear-gradient(0deg,#020d1a,rgba(2,13,26,0.97));border-top:1px solid var(--border);padding:8px 12px 12px;z-index:1000;flex-shrink:0}
#action-row{display:flex;gap:6px;margin-bottom:8px}
.btn{flex:1;padding:10px 4px;border:1px solid var(--border);background:var(--glass);color:var(--cyan);font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:1px;cursor:pointer;border-radius:4px;transition:all 0.2s}
.btn:active{transform:scale(0.95)}
.btn-register{border-color:var(--green);color:var(--green);background:rgba(0,255,157,0.08)}
.btn-log{border-color:var(--amber);color:var(--amber);background:rgba(255,170,0,0.08)}
.btn-heading{border-color:var(--cyan)}
.btn-mode{border-color:#a78bfa;color:#a78bfa;background:rgba(167,139,250,0.08)}
.btn-locate{border-color:var(--cyan);color:var(--cyan)}
.btn.active{box-shadow:0 0 12px currentColor;filter:brightness(1.3)}
#wp-panel{max-height:90px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--teal) transparent}
.wp-item{display:flex;align-items:center;padding:5px 8px;border:1px solid rgba(0,212,255,0.1);border-radius:3px;margin-bottom:3px;background:rgba(0,212,255,0.04);gap:8px}
.wp-dot{width:9px;height:9px;background:var(--green);border-radius:50%;box-shadow:0 0 7px var(--green);flex-shrink:0}
.wp-dot.mountain{background:#a78bfa;box-shadow:0 0 7px #a78bfa}
.wp-name{flex:1;font-size:11px;border:none;background:transparent;font-family:'Share Tech Mono',monospace;color:var(--green);outline:none;cursor:pointer;min-width:0}
.wp-name.mountain{color:#a78bfa}
.wp-name:focus{border-bottom:1px solid currentColor}
.wp-coords{font-size:8px;color:rgba(0,212,255,0.45);flex-shrink:0}
.wp-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:0 3px;opacity:0.6}

/* Compass - large and clear */
#compass-wrap{position:absolute;top:10px;right:10px;z-index:999;display:flex;flex-direction:column;align-items:center;gap:4px}
#compass-ring{width:80px;height:80px;border-radius:50%;border:2px solid var(--border);background:radial-gradient(circle,rgba(4,20,40,0.95),rgba(2,13,26,0.98));position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(0,212,255,0.2)}
/* Cardinal labels */
.card{position:absolute;font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700}
#cn{top:4px;left:50%;transform:translateX(-50%);color:var(--red)}
#cs{bottom:4px;left:50%;transform:translateX(-50%);color:rgba(0,212,255,0.6)}
#cw{left:4px;top:50%;transform:translateY(-50%);color:rgba(0,212,255,0.5)}
#ce{right:4px;top:50%;transform:translateY(-50%);color:rgba(0,212,255,0.5)}
#compass-arrow{position:absolute;width:100%;height:100%;top:0;left:0;transition:transform 0.25s ease}
#compass-hdg{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:var(--cyan);text-shadow:0 0 10px var(--cyan);letter-spacing:1px}
#compass-dir{font-size:9px;color:rgba(0,212,255,0.6)}

/* GPS status */
#gps-status{position:absolute;top:10px;left:10px;z-index:999;background:rgba(2,13,26,0.88);border:1px solid var(--border);padding:6px 10px;border-radius:5px;font-size:10px;line-height:1.6}
#gps-dot-status{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:5px;vertical-align:middle}
#gps-dot-status.ok{background:var(--green);animation:gpspulse 2s infinite}
#gps-dot-status.err{background:var(--red)}
@keyframes gpspulse{0%,100%{opacity:1}50%{opacity:0.4}}
#gps-acc-val{color:var(--amber);font-size:9px}
#gps-acc-val.good{color:var(--green)}

/* Heading arrow marker on map */
.heading-marker{width:40px;height:40px;position:relative}
.heading-marker svg{width:40px;height:40px;filter:drop-shadow(0 0 6px #00d4ff)}

/* Log panel */
#log-panel{position:absolute;bottom:10px;left:10px;right:100px;background:rgba(2,13,26,0.93);border:1px solid var(--border);border-radius:5px;padding:8px;z-index:999;display:none;max-height:120px;overflow-y:auto}
#log-panel.show{display:block}
.log-e{font-size:9px;color:rgba(0,212,255,0.65);padding:2px 0;border-bottom:1px solid rgba(0,212,255,0.05);display:flex;gap:6px}
.log-t{color:var(--amber);flex-shrink:0}
.sec-title{font-size:8px;letter-spacing:2px;color:rgba(0,212,255,0.38);margin-bottom:5px}
#rec-dot{width:7px;height:7px;border-radius:50%;background:var(--red);display:none}
#rec-dot.active{display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.1}}

/* Modal */
#modal-overlay{position:fixed;inset:0;background:rgba(2,13,26,0.88);z-index:2000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#modal-overlay.show{display:flex}
#modal{background:var(--deep);border:1px solid var(--border);border-radius:8px;padding:20px;width:82%;max-width:320px;box-shadow:0 0 35px rgba(0,212,255,0.2)}
#modal h2{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--green);letter-spacing:2px;margin-bottom:12px}
#modal input{width:100%;background:rgba(0,212,255,0.06);border:1px solid var(--border);border-radius:4px;padding:9px 11px;color:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:13px;outline:none;margin-bottom:14px}
#modal input:focus{border-color:var(--green)}
#modal-coords{font-size:10px;color:rgba(0,212,255,0.6);margin-bottom:14px;line-height:1.7}
#modal-btns{display:flex;gap:8px}
#modal-btns .btn{padding:9px}
.btn-confirm{border-color:var(--green);color:var(--green);background:rgba(0,255,157,0.1)}
.btn-cancel{border-color:rgba(255,68,85,0.5);color:var(--red);background:rgba(255,68,85,0.05)}
.wp-pin{width:12px;height:12px;background:var(--green);border-radius:50%;border:2px solid rgba(0,255,157,0.4);box-shadow:0 0 8px var(--green)}
.wp-pin.mountain{background:#a78bfa;border-color:rgba(167,139,250,0.4);box-shadow:0 0 8px #a78bfa}
</style>
</head>
<body>

<div id="header">
  <h1 id="app-title">⚓ MARINE TRACKER</h1>
  <div id="status-bar">
    <div class="si"><span class="sl">LAT</span><span class="sv" id="d-lat">---</span></div>
    <div class="si"><span class="sl">LNG</span><span class="sv" id="d-lng">---</span></div>
    <div class="si"><span class="sl">HDG</span><span class="sv" id="d-hdg">---°</span></div>
    <div class="si"><span class="sl">SPD</span><span class="sv" id="d-spd">--</span></div>
    <div class="si"><span class="sl">REC</span><span class="sv"><span id="rec-dot"></span></span></div>
  </div>
</div>

<div id="map">
  <!-- GPS Status -->
  <div id="gps-status">
    <span id="gps-dot-status"></span><span id="gps-msg">GPS取得中...</span><br>
    <span id="gps-acc-val">精度: ---</span>
  </div>

  <!-- Compass -->
  <div id="compass-wrap">
    <div id="compass-ring">
      <span class="card" id="cn">N</span>
      <span class="card" id="cs">S</span>
      <span class="card" id="cw">W</span>
      <span class="card" id="ce">E</span>
      <svg id="compass-arrow" viewBox="0 0 80 80">
        <!-- North arrow (red) -->
        <polygon points="40,8 46,40 40,36 34,40" fill="#ff4455" opacity="0.9"/>
        <!-- South arrow (blue) -->
        <polygon points="40,72 46,40 40,44 34,40" fill="rgba(0,212,255,0.5)" opacity="0.9"/>
        <!-- Center dot -->
        <circle cx="40" cy="40" r="4" fill="#00d4ff" opacity="0.9"/>
      </svg>
    </div>
    <div id="compass-hdg">---°</div>
    <div id="compass-dir">---</div>
  </div>

  <div id="log-panel"><div class="sec-title">◈ GPSログ</div><div id="log-entries"></div></div>
</div>

<div id="bottom-panel">
  <div id="action-row">
    <button class="btn btn-register" onclick="openModal()">📍 登録</button>
    <button class="btn btn-heading" id="btn-hdg" onclick="toggleHeading()">🧭 HDG UP</button>
    <button class="btn btn-log" id="btn-log" onclick="toggleLog()">● LOG</button>
    <button class="btn btn-locate" onclick="locateMe()">🎯 現在地</button>
    <button class="btn btn-mode" id="btn-mode" onclick="toggleMode()">⛵ 海</button>
  </div>
  <div class="sec-title">◈ 登録ポイント (<span id="wp-count">0</span>)</div>
  <div id="wp-panel"><div style="font-size:10px;color:rgba(0,212,255,0.28);text-align:center;padding:6px">登録ポイントなし</div></div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title">📍 ポイント登録</h2>
    <div id="modal-coords">---</div>
    <input type="text" id="modal-input" placeholder="名前を入力..." maxlength="30">
    <div id="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-confirm" onclick="confirmReg()">登録</button>
    </div>
  </div>

<!-- GPS Permission Overlay -->
<div id="gps-permission-overlay" style="position:fixed;inset:0;background:rgba(2,13,26,0.95);z-index:3000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:30px">
  <div style="font-family:'Orbitron',sans-serif;font-size:16px;color:#00d4ff;text-align:center;letter-spacing:2px;text-shadow:0 0 15px #00d4ff">📡 位置情報</div>
  <div style="font-size:12px;color:rgba(0,212,255,0.7);text-align:center;line-height:1.8">
    現在地を取得するために<br>位置情報へのアクセスを<br>許可してください
  </div>
  <button onclick="requestGPSPermission()" style="padding:16px 32px;background:rgba(0,255,157,0.12);border:2px solid #00ff9d;color:#00ff9d;font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:2px;border-radius:6px;cursor:pointer;box-shadow:0 0 20px rgba(0,255,157,0.3)">
    🎯 位置情報を許可する
  </button>
  <div style="font-size:10px;color:rgba(0,212,255,0.35);text-align:center;line-height:1.7">
    ブラウザのダイアログで<br>「許可」を選択してください
  </div>
</div>

<script>
let map, currentMarker, trackLine;
let trackCoords = [], waypoints = [];
let currentPos = null, currentHeading = 0;
let headingUp = false, logging = false;
let mode = 'sea';
let watchId = null;
let layers = {};

// ===== DIRECTION LABEL =====
function headingToDir(h) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(h / 22.5) % 16];
}

// ===== MAP INIT =====
function initMap() {
  map = L.map('map', { center: [35.45, 139.65], zoom: 14, zoomControl: true, attributionControl: false });
  layers.osmBase = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, opacity: 0.75 });
  layers.sea = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', { maxZoom: 18 });
  layers.topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 });
  layers.osmBase.addTo(map);
  layers.sea.addTo(map);
  trackLine = L.polyline([], { color: '#00d4ff', weight: 2, opacity: 0.75, dashArray: '5,5' }).addTo(map);
  L.control.attribution({ position: 'bottomleft', prefix: '' })
    .addAttribution('© OpenStreetMap © OpenSeaMap © OpenTopoMap').addTo(map);
}

// ===== MODE TOGGLE =====
function toggleMode() {
  mode = mode === 'sea' ? 'mountain' : 'sea';
  const btn = document.getElementById('btn-mode');
  if (mode === 'mountain') {
    map.removeLayer(layers.osmBase);
    map.removeLayer(layers.sea);
    layers.topo.addTo(map);
    btn.textContent = '🏔 山';
    document.getElementById('app-title').textContent = '🏔 MOUNTAIN TRACKER';
  } else {
    map.removeLayer(layers.topo);
    layers.osmBase.addTo(map);
    layers.sea.addTo(map);
    btn.textContent = '⛵ 海';
    document.getElementById('app-title').textContent = '⚓ MARINE TRACKER';
  }
}

// ===== GPS =====
function startGPS() {
  if (!navigator.geolocation) {
    setGPSStatus('err', 'GPS非対応ブラウザ', '');
    return;
  }
  // Hide overlay, try directly first
  document.getElementById('gps-permission-overlay').style.display = 'none';
  setGPSStatus('wait', 'GPS取得中...', '');
  navigator.geolocation.getCurrentPosition(
    pos => {
      onGPSSuccess(pos);
      watchId = navigator.geolocation.watchPosition(
        p => onGPSSuccess(p),
        e => onGPSError(e),
        { enableHighAccuracy: true, maximumAge: 3000, timeout: 30000 }
      );
    },
    err => {
      // Auto-request failed, show permission button
      document.getElementById('gps-permission-overlay').style.display = 'flex';
      if (err.code === 1) {
        document.querySelector('#gps-permission-overlay div:nth-child(2)').innerHTML =
          '「位置情報を許可する」を<br>タップしてください';
      }
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

function requestGPSPermission() {
  document.getElementById('gps-permission-overlay').style.display = 'none';
  setGPSStatus('wait', 'GPS取得中...', '');

  // getCurrentPosition triggers browser permission dialog on user gesture
  navigator.geolocation.getCurrentPosition(
    pos => {
      onGPSSuccess(pos);
      watchId = navigator.geolocation.watchPosition(
        p => onGPSSuccess(p),
        e => onGPSError(e),
        { enableHighAccuracy: true, maximumAge: 3000, timeout: 30000 }
      );
    },
    err => {
      onGPSError(err);
      // Show retry button if denied
      if (err.code === 1) {
        document.getElementById('gps-permission-overlay').style.display = 'flex';
        document.querySelector('#gps-permission-overlay div:nth-child(2)').innerHTML =
          '位置情報が拒否されました<br>ブラウザの設定から<br>位置情報を許可してください';
      }
    },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
  );
}

function onGPSSuccess(pos) {
  const { latitude: lat, longitude: lng, speed, accuracy, heading } = pos.coords;
  const acc = Math.round(accuracy);
  setGPSStatus('ok', '現在地取得中', acc + 'm');
  if (heading !== null && !isNaN(heading)) updateHeading(heading);
  const spd = speed ? (mode === 'sea' ? speed * 1.94384 : speed * 3.6) : 0;
  updatePos(lat, lng, spd, accuracy);
}

function onGPSError(err) {
  let msg = '';
  switch(err.code) {
    case 1: msg = '位置情報を許可してください'; break;
    case 2: msg = 'GPS信号なし'; break;
    case 3: msg = 'GPS取得タイムアウト'; break;
    default: msg = 'GPS取得エラー';
  }
  setGPSStatus('err', msg, '');
}

function setGPSStatus(state, msg, acc) {
  const dot = document.getElementById('gps-dot-status');
  dot.className = state === 'ok' ? 'ok' : state === 'err' ? 'err' : '';
  document.getElementById('gps-msg').textContent = msg;
  const accEl = document.getElementById('gps-acc-val');
  if (acc) {
    accEl.textContent = '精度: ' + acc;
    accEl.className = parseInt(acc) < 20 ? 'good' : '';
  } else {
    accEl.textContent = '';
  }
}

function updatePos(lat, lng, spd, acc) {
  currentPos = { lat, lng };
  document.getElementById('d-lat').textContent = lat.toFixed(5);
  document.getElementById('d-lng').textContent = lng.toFixed(5);
  document.getElementById('d-spd').textContent = spd.toFixed(1) + (mode === 'sea' ? 'kt' : 'km/h');

  updateHeadingMarker(lat, lng, currentHeading);

  if (logging) {
    trackCoords.push([lat, lng]);
    trackLine.setLatLngs(trackCoords);
    addLog(lat, lng, spd);
  }
  if (headingUp) map.setView([lat, lng]);
}

// ===== HEADING ARROW MARKER =====
function getHeadingMarkerHTML(heading, isSea) {
  const color = isSea ? '#00d4ff' : '#a78bfa';
  const glow = isSea ? '#00d4ff' : '#a78bfa';
  // Arrow SVG pointing up (north=0), rotated by heading
  return `
    <svg width="44" height="44" viewBox="0 0 44 44" style="filter:drop-shadow(0 0 8px ${glow});transform:rotate(${heading}deg);display:block">
      <!-- Body -->
      <polygon points="22,2 30,42 22,34 14,42" fill="${color}" opacity="0.95"/>
      <!-- Center -->
      <circle cx="22" cy="22" r="4" fill="white" opacity="0.9"/>
      <!-- Back fins -->
      <polygon points="14,42 22,34 22,38" fill="rgba(255,255,255,0.3)"/>
      <polygon points="30,42 22,34 22,38" fill="rgba(255,255,255,0.3)"/>
    </svg>`;
}

function updateHeadingMarker(lat, lng, heading) {
  const isSea = mode === 'sea';
  const icon = L.divIcon({
    className: '',
    html: getHeadingMarkerHTML(heading, isSea),
    iconSize: [44, 44],
    iconAnchor: [22, 22]
  });
  if (currentMarker) {
    currentMarker.setLatLng([lat, lng]);
    currentMarker.setIcon(icon);
  } else {
    currentMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000 }).addTo(map);
    map.setView([lat, lng], 15);
  }
}

// ===== COMPASS =====
function startCompass() {
  const handler = e => {
    let h = null;
    if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
      h = e.webkitCompassHeading; // iOS
    } else if (e.absolute && e.alpha !== null) {
      h = (360 - e.alpha) % 360; // Android absolute
    } else if (e.alpha !== null) {
      h = (360 - e.alpha) % 360;
    }
    if (h !== null && !isNaN(h)) updateHeading(h);
  };

  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    // iOS 13+: needs user gesture
    DeviceOrientationEvent.requestPermission()
      .then(s => {
        if (s === 'granted') {
          window.addEventListener('deviceorientationabsolute', handler, true);
          window.addEventListener('deviceorientation', handler, true);
        }
      }).catch(() => {});
  } else {
    window.addEventListener('deviceorientationabsolute', handler, true);
    window.addEventListener('deviceorientation', handler, true);
  }
}

function updateHeading(h) {
  currentHeading = h;
  const rounded = Math.round(h);
  document.getElementById('d-hdg').textContent = rounded + '°';
  document.getElementById('compass-hdg').textContent = rounded + '°';
  document.getElementById('compass-dir').textContent = headingToDir(h);
  // Rotate compass: arrow points N, so rotate opposite to heading
  document.getElementById('compass-arrow').style.transform = `rotate(${-h}deg)`;
  // Update heading marker on map
  if (currentPos) updateHeadingMarker(currentPos.lat, currentPos.lng, h);
}

// ===== HEADING UP =====
function toggleHeading() {
  headingUp = !headingUp;
  const btn = document.getElementById('btn-hdg');
  btn.classList.toggle('active', headingUp);
  btn.textContent = headingUp ? '🧭 HDG ✓' : '🧭 HDG UP';
  if (headingUp) {
    startCompass();
    if (currentPos) map.setView([currentPos.lat, currentPos.lng]);
  }
}

// ===== LOCATE =====
function locateMe() {
  if (!currentPos) { document.getElementById('gps-permission-overlay').style.display='flex'; return; }
  map.flyTo([currentPos.lat, currentPos.lng], 16, { duration: 1.0 });
}

// ===== LOGGING =====
function toggleLog() {
  logging = !logging;
  const btn = document.getElementById('btn-log');
  const dot = document.getElementById('rec-dot');
  if (logging) {
    trackCoords = []; trackLine.setLatLngs([]);
    document.getElementById('log-entries').innerHTML = '';
    document.getElementById('log-panel').classList.add('show');
    btn.classList.add('active'); btn.textContent = '■ STOP';
    dot.classList.add('active');
  } else {
    btn.classList.remove('active'); btn.textContent = '● LOG';
    dot.classList.remove('active');
  }
}

function addLog(lat, lng, spd) {
  const t = new Date().toTimeString().slice(0, 8);
  const el = document.createElement('div');
  el.className = 'log-e';
  el.innerHTML = `<span class="log-t">${t}</span>${lat.toFixed(4)},${lng.toFixed(4)} ${spd.toFixed(1)}`;
  const c = document.getElementById('log-entries');
  c.appendChild(el);
  c.scrollTop = c.scrollHeight;
}

// ===== WAYPOINTS =====
let pendingPos = null;

function openModal() {
  if (!currentPos) { document.getElementById('gps-permission-overlay').style.display='flex'; return; }
  pendingPos = { ...currentPos };
  document.getElementById('modal-title').textContent = mode === 'mountain' ? '🏔 ポイント登録' : '📍 ポイント登録';
  document.getElementById('modal-coords').innerHTML =
    `緯度: <b>${pendingPos.lat.toFixed(6)}</b><br>経度: <b>${pendingPos.lng.toFixed(6)}</b>`;
  document.getElementById('modal-input').value = '';
  document.getElementById('modal-overlay').classList.add('show');
  setTimeout(() => document.getElementById('modal-input').focus(), 100);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
  pendingPos = null;
}

function confirmReg() {
  const name = document.getElementById('modal-input').value.trim();
  if (!name) { document.getElementById('modal-input').focus(); return; }
  const wp = { id: Date.now(), name, lat: pendingPos.lat, lng: pendingPos.lng, mode };
  waypoints.push(wp);
  addWpMarker(wp);
  renderWpList();
  closeModal();
}

function addWpMarker(wp) {
  const isMtn = wp.mode === 'mountain';
  const icon = L.divIcon({
    className: '',
    html: `<div class="wp-pin${isMtn ? ' mountain' : ''}"></div>`,
    iconSize: [12, 12], iconAnchor: [6, 6]
  });
  const color = isMtn ? '#a78bfa' : '#00ff9d';
  wp.marker = L.marker([wp.lat, wp.lng], { icon })
    .bindPopup(`<b style="color:${color};font-family:monospace">${wp.name}</b><br><span style="font-size:10px;color:#aaa">${wp.lat.toFixed(5)}, ${wp.lng.toFixed(5)}</span>`)
    .addTo(map);
}

function renderWpList() {
  const panel = document.getElementById('wp-panel');
  document.getElementById('wp-count').textContent = waypoints.length;
  if (!waypoints.length) {
    panel.innerHTML = '<div style="font-size:10px;color:rgba(0,212,255,0.28);text-align:center;padding:6px">登録ポイントなし</div>';
    return;
  }
  panel.innerHTML = waypoints.map((wp, i) => `
    <div class="wp-item">
      <div class="wp-dot${wp.mode === 'mountain' ? ' mountain' : ''}"></div>
      <input class="wp-name${wp.mode === 'mountain' ? ' mountain' : ''}" type="text" value="${wp.name}"
        onchange="renameWp(${i},this.value)" onclick="flyWp(${i})">
      <span class="wp-coords">${wp.lat.toFixed(3)},${wp.lng.toFixed(3)}</span>
      <button class="wp-del" onclick="delWp(${i})">✕</button>
    </div>`).join('');
}

function renameWp(i, name) {
  if (!name.trim()) return;
  waypoints[i].name = name.trim();
  const color = waypoints[i].mode === 'mountain' ? '#a78bfa' : '#00ff9d';
  if (waypoints[i].marker)
    waypoints[i].marker.getPopup().setContent(
      `<b style="color:${color};font-family:monospace">${name}</b><br><span style="font-size:10px;color:#aaa">${waypoints[i].lat.toFixed(5)}, ${waypoints[i].lng.toFixed(5)}</span>`);
}

function flyWp(i) {
  map.flyTo([waypoints[i].lat, waypoints[i].lng], 16, { duration: 1 });
  if (waypoints[i].marker) waypoints[i].marker.openPopup();
}

function delWp(i) {
  if (waypoints[i].marker) map.removeLayer(waypoints[i].marker);
  waypoints.splice(i, 1);
  renderWpList();
}

document.getElementById('modal-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmReg();
  if (e.key === 'Escape') closeModal();
});

initMap();
startGPS();
startCompass();
</script>
</body>
</html>
